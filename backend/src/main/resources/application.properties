spring.application.name=civicsync-backend
server.port=${CIVICSYNC_PORT:8081}
spring.profiles.active=${CIVICSYNC_PROFILE:dev}

spring.datasource.url=${CIVICSYNC_DB_URL:jdbc:mysql://localhost:3306/civicsync}
spring.datasource.username=${CIVICSYNC_DB_USER:root}
spring.datasource.password=${CIVICSYNC_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${CIVICSYNC_DDL_AUTO:validate}
spring.jpa.show-sql=false
logging.level.root=INFO
debug=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT
jwt.secret=${CIVICSYNC_JWT_SECRET:localDevelopmentOnlyChangeThisSecretBeforeProduction12345}
jwt.expiration.ms=86400000

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=${CIVICSYNC_UPLOAD_DIR:uploads}
identity.documents-dir=${CIVICSYNC_IDENTITY_DIR:private-documents}

# Email delivery is active when CIVICSYNC_SMTP_HOST is configured.
spring.mail.host=${CIVICSYNC_SMTP_HOST:}
spring.mail.port=${CIVICSYNC_SMTP_PORT:587}
spring.mail.username=${CIVICSYNC_SMTP_USER:}
spring.mail.password=${CIVICSYNC_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${CIVICSYNC_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${CIVICSYNC_SMTP_STARTTLS:true}
civicsync.mail.from=${CIVICSYNC_MAIL_FROM:no-reply@civicsync.local}
civicsync.public-base-url=${CIVICSYNC_PUBLIC_BASE_URL:http://localhost:5173}
